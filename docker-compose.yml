# Local development: PostgreSQL 18 and a Keycloak with a development realm.
#   docker compose up -d
# Keycloak: http://localhost:8090 (admin / admin), realm "logbuch".
name: logbuch-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: logbuch
      POSTGRES_PASSWORD: logbuch
      POSTGRES_DB: logbuch
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbuch -d logbuch"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
