name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "src/lib/db/schema.ts has changes without a migration. Run: npm run db:generate"
            exit 1
          fi
      - run: npm run build
      # Moderate findings are excluded: the only ones today come from
      # drizzle-kit (a Better Auth peer dependency) and affect esbuild's dev
      # server, which never runs in production.
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logbuch
          POSTGRES_PASSWORD: logbuch
          POSTGRES_DB: logbuch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbuch -d logbuch"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://logbuch:logbuch@localhost:5432/logbuch_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  e2e:
    name: End-to-end tests (Keycloak, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: logbuch
          POSTGRES_PASSWORD: logbuch
          POSTGRES_DB: logbuch
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U logbuch -d logbuch"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Keycloak with the development realm
        run: |
          docker run -d --name keycloak -p 8090:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/dev/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.6.1 start-dev --import-realm --http-port=8080
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8090/realms/logbuch/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak | tail -50
          exit 1
      - name: Start Logbuch (web and worker)
        run: |
          set -a; source .env.example; set +a
          # Production refuses the example secret.
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          export NODE_ENV=production TZ=Europe/Amsterdam PORT=3000 HOSTNAME=127.0.0.1 WORKER_HEARTBEAT_FILE="$RUNNER_TEMP/heartbeat"
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          LOGBUCH_PROCESS=migrate node dist/migrate.mjs
          LOGBUCH_PROCESS=web nohup node .next/standalone/server.js > "$RUNNER_TEMP/web.log" 2>&1 &
          LOGBUCH_PROCESS=worker nohup node dist/worker.mjs > "$RUNNER_TEMP/worker.log" 2>&1 &
          # A second instance with the manual directory and its own database.
          PGPASSWORD=logbuch psql -h localhost -p 55432 -U logbuch -d logbuch -c "create database logbuch_manual"
          export DATABASE_URL=postgres://logbuch:logbuch@localhost:55432/logbuch_manual
          export DIRECTORY=manual INITIAL_ADMIN_EMAILS=adam@example.test LOGBUCH_BASE_URL=http://localhost:3001 PORT=3001
          LOGBUCH_PROCESS=migrate node dist/migrate.mjs
          LOGBUCH_PROCESS=web nohup node .next/standalone/server.js > "$RUNNER_TEMP/web-manual.log" 2>&1 &
      - name: Wait for Logbuch
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/-/readyz > /dev/null && curl -fsS http://127.0.0.1:3001/-/readyz > /dev/null && exit 0
            sleep 2
          done
          echo "Logbuch did not become ready"
          cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/web-manual.log"
          exit 1
      - run: npm run test:e2e
        env:
          CI: "true"
          # The proposal tests move deadlines into the past in the app's database.
          DATABASE_URL: postgres://logbuch:logbuch@localhost:55432/logbuch
      - name: Logs
        if: failure()
        run: cat "$RUNNER_TEMP/web.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/web-manual.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t logbuch:ci .
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id logbuch:ci -u)" = "1000"
